    method: positive_q95
    artifact: artifacts/feature_scales/ambik_v1_feature_scales.csv
  alpha: [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]

execution:
  include_baselines: true
  generation_seed: 0
  resume: true
