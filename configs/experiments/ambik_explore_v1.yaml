experiment:
  name: ambik_explore_v1
  phase: explore
  seed: 20260717
  output_root: outputs/manifest_runs
  dataset_profile: configs/datasets/ambik_v1.yaml
  decoding_profile: configs/decoding/ambik_deterministic.yaml
  metrics_profile: configs/metrics/ambik_metrics.yaml
  model_profiles:
    - configs/models/gemma2b.yaml
    - configs/models/gemma9b.yaml
    - configs/models/llama1b.yaml
    - configs/models/llama8b.yaml
  split_name: explore400
  instruction_variant: paired

features:
  catalog: manifests/feature_catalog.csv
  enabled_only: true

steering:
  scale:
    method: relative_residual_l2
    artifact: artifacts/feature_scales/ambik_v1_relative_residual_l2.csv
  # Preliminary residual-norm fractions. Validate on smoke20 before the full sweep.
  alpha: [-0.1, -0.03, -0.01, 0.01, 0.03, 0.1]

execution:
  include_baselines: true
  generation_seed: 0
  resume: true
